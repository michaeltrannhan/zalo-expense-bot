name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Application schema is applied by migrate/simulate; integration
          # tests use a dedicated *_test database created below.
          POSTGRES_DB: zl_expense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zl_expense"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zl_expense_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zl_expense?sslmode=disable
      ZALO_WEBHOOK_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Create integration test database
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; do sleep 0.5; done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM pg_database WHERE datname = 'zl_expense_test'" | grep -q 1 \
            || PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE zl_expense_test"
      - name: Integration tests
        run: go test -p 1 -count=1 -tags integration ./...
      - name: Race integration tests
        run: go test -p 1 -race -count=1 -tags integration ./...
      - name: Build
        run: go build ./...
      - name: Deterministic simulation
        env:
          EXTRACTION_ENABLED: "true"
          OUTBOUND_ENABLED: "true"
        run: go run ./cmd/simulate
