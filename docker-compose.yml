# Local development stack. No cloud services: PostgreSQL is the only
# infrastructure dependency. Queue, object storage and extraction are
# process-local adapters (see internal/platform and internal/extraction).
services:
  postgres:
    image: postgres:16-alpine
    container_name: zl-expese-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zl_expense
    ports:
      # Host port is overridable so a conflicting local postgres (or another
      # project's container) can coexist: set POSTGRES_PORT in .env.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zl_expense"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
